name: 💡 Feature Request
description: Suggest an idea or enhancement for OpenTiming
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggesting a new feature or improvement.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem or limitation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the proposed solution
      description: What would you like OpenTiming to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Additional context or alternatives considered
