name: 🐛 Bug Report
description: Create a report to help us improve OpenTiming
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: input
    id: os-version
    attributes:
      label: macOS Version
      description: e.g. macOS Sonoma 14.5 or macOS Sequoia 15.0 (Apple Silicon / Intel)
      placeholder: macOS 14.5 (Apple Silicon)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal / Console Logs (if any)
      render: shell
